tags:
  - Auth
summary: Send user's password reset email
operationId: send-reset-email
description: This endpoint sends a password reset email to the user.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: 'john.doe@mail.com'
responses:
  '200':
    $ref: ../../components/responces/auth/200auth-send reset-email.yaml
  '404':
    $ref: ../../components/responces/auth/404auth.yaml
